<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Bhawani Commission Agent</title>
<style>
:root{--g:#0f5132;--g2:#198754;--bg:#f5f7f6;--card:#fff;--txt:#17221c;--muted:#6c757d;--red:#b42318;--gold:#b8860b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--txt)}header{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:20px 18px 24px;border-radius:0 0 22px 22px;position:sticky;top:0;z-index:5}header h1{font-size:22px;margin:0 0 4px}header p{margin:0;opacity:.8;font-size:13px}.wrap{padding:14px 14px 92px;max-width:720px;margin:auto}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:3px}.stat{background:var(--card);padding:15px;border-radius:16px;box-shadow:0 3px 16px #0000000d}.stat.wide{grid-column:1/-1}.stat small{color:var(--muted);font-size:12px}.stat b{display:block;font-size:21px;margin-top:7px}.gold b{color:var(--gold)}.due b{color:var(--red)}.section{margin-top:17px}.section h2{font-size:16px;margin:0 0 10px}.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 12px #0000000b}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.name{font-weight:700}.muted{color:var(--muted);font-size:12px}.pill{padding:5px 8px;border-radius:99px;background:#edf7f1;color:var(--g);font-size:11px;font-weight:700}.pill.red{background:#fff0ef;color:var(--red)}button,.btn{border:0;border-radius:11px;padding:11px 13px;font-weight:700;background:var(--g);color:#fff;text-decoration:none;display:inline-block;text-align:center}.btn.light{background:#edf7f1;color:var(--g)}.btn.red{background:#fff0ef;color:var(--red)}.actions{display:flex;gap:8px;margin-top:10px}.actions>*{flex:1}.fab{position:fixed;right:18px;bottom:78px;width:54px;height:54px;border-radius:50%;font-size:28px;box-shadow:0 5px 18px #0003;z-index:8}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e6e6e6;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 3px 8px;z-index:9}.nav button{background:none;color:#707a74;padding:5px;font-size:11px}.nav button.active{color:var(--g)}.nav span{font-size:20px;display:block;margin-bottom:2px}.screen{display:none}.screen.active{display:block}.form label{display:block;font-size:12px;font-weight:700;margin:11px 0 6px}.form input,.form textarea{width:100%;border:1px solid #dbe2de;border-radius:11px;padding:12px;background:#fff;font-size:15px}.form textarea{min-height:72px;resize:vertical}.form .two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.submit{width:100%;padding:14px;margin-top:15px;font-size:15px}.empty{text-align:center;color:var(--muted);padding:28px 10px}.photo{width:68px;height:68px;border-radius:12px;object-fit:cover;background:#eee}.profileTop{display:flex;gap:12px;align-items:center}.profileTop .avatar{width:48px;height:48px;border-radius:50%;background:#e7f3ec;color:var(--g);display:grid;place-items:center;font-weight:800;font-size:20px}.back{background:none;color:var(--g);padding:0;margin-bottom:10px}.danger{color:var(--red)}
</style></head><body>
<header><h1>Bhawani Commission Agent</h1><p>Loan • Gold • Interest Tracker</p></header>
<div class="wrap">
<section id="home" class="screen active"><div class="stats"><div class="stat"><small>Total Loan</small><b id="totalLoan">₹0</b></div><div class="stat gold"><small>Total Gold</small><b id="totalGold">0 Tola</b></div><div class="stat wide due"><small>Interest Due Customers</small><b id="dueCount">0</b></div></div><div class="section"><h2>Interest Due</h2><div id="homeDue"></div></div><div class="section"><h2>Recent Loans</h2><div id="recentLoans"></div></div></section>
<section id="loans" class="screen"><div class="section"><h2>All Loans</h2><div id="loanList"></div></div></section>
<section id="due" class="screen"><div class="section"><h2>Monthly Interest Due</h2><div id="dueList"></div></div></section>
<section id="customers" class="screen"><div class="section"><h2>Customers</h2><div id="customerList"></div></div></section>
<section id="add" class="screen"><button class="back" onclick="go('home')">← Back</button><div class="card form"><h2>New Loan Entry</h2><label>Customer Name</label><input id="fName" placeholder="Customer name"><label>Mobile Number</label><input id="fMobile" inputmode="tel" placeholder="03xxxxxxxxx"><div class="two"><div><label>Loan Amount</label><input id="fAmount" type="number" placeholder="0"></div><div><label>Interest % / Month</label><input id="fInterest" type="number" step="0.01" placeholder="0"></div></div><div class="two"><div><label>Loan Date</label><input id="fDate" type="date"></div><div><label>Gold Tola</label><input id="fGold" type="number" step="0.001" placeholder="0"></div></div><label>Item Details</label><textarea id="fDetails" placeholder="Ring, chain, bangle etc."></textarea><label>Gold / Item Photo</label><input id="fPhoto" type="file" accept="image/*"><button class="submit" onclick="saveLoan()">Save Loan</button></div></section>
<section id="profile" class="screen"><button class="back" onclick="go('customers')">← Customers</button><div id="profileBody"></div></section>
</div>
<button class="fab" onclick="go('add')">＋</button>
<nav class="nav"><button data-s="home" class="active" onclick="go('home')"><span>⌂</span>Home</button><button data-s="loans" onclick="go('loans')"><span>₹</span>Loans</button><button data-s="due" onclick="go('due')"><span>◷</span>Due</button><button data-s="customers" onclick="go('customers')"><span>♟</span>Customers</button></nav>
<script>
const KEY='bhawani_loans_v1';let loans=JSON.parse(localStorage.getItem(KEY)||'[]');const $=id=>document.getElementById(id);const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function monthsDue(l){let d=new Date(l.date+'T00:00:00'),now=new Date(),m=(now.getFullYear()-d.getFullYear())*12+(now.getMonth()-d.getMonth())+1;return Math.max(1,m)-(l.paidMonths||0)}function monthlyInterest(l){return Number(l.amount)*Number(l.interest)/100}function dueAmount(l){return Math.max(0,monthsDue(l))*monthlyInterest(l)}function persist(){localStorage.setItem(KEY,JSON.stringify(loans))}function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.s===id));window.scrollTo(0,0);render()}function readPhoto(file,cb){if(!file){cb('');return}let r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file)}function saveLoan(){let name=$('fName').value.trim(),mobile=$('fMobile').value.trim(),amount=+$('fAmount').value,interest=+$('fInterest').value,date=$('fDate').value,gold=+$('fGold').value,details=$('fDetails').value.trim(),file=$('fPhoto').files[0];if(!name||!mobile||!amount||!date){alert('Customer name, mobile, loan amount aur loan date required hain.');return}readPhoto(file,photo=>{loans.unshift({id:Date.now(),name,mobile,amount,interest,date,gold,details,photo,paidMonths:0,payments:[]});persist();['fName','fMobile','fAmount','fInterest','fGold','fDetails','fPhoto'].forEach(id=>$(id).value='');$('fDate').value=new Date().toISOString().slice(0,10);go('home')})}function pay(id){let l=loans.find(x=>x.id===id);if(!l)return;if(monthsDue(l)<=0){alert('No interest due.');return}l.paidMonths=(l.paidMonths||0)+1;l.payments=l.payments||[];l.payments.unshift({date:new Date().toISOString(),amount:monthlyInterest(l)});persist();render()}function loanCard(l,showPay=true){let due=dueAmount(l);return `<div class="card"><div class="row"><div><div class="name">${esc(l.name)}</div><div class="muted">${esc(l.mobile)} • ${esc(l.date)}</div></div><span class="pill">${Number(l.gold||0).toFixed(3)} Tola</span></div><div class="row" style="margin-top:10px"><div><div class="muted">Loan</div><b>${money(l.amount)}</b></div><div style="text-align:right"><div class="muted">Interest Due</div><b class="danger">${money(due)}</b></div></div><div class="muted" style="margin-top:8px">${esc(l.details||'No item details')}</div><div class="actions"><a class="btn light" href="tel:${esc(l.mobile)}">Call</a>${showPay&&due>0?`<button onclick="pay(${l.id})">Mark 1 Month Paid</button>`:''}</div></div>`}function renderHome(){let total=loans.reduce((a,l)=>a+Number(l.amount||0),0),gold=loans.reduce((a,l)=>a+Number(l.gold||0),0),dues=loans.filter(l=>dueAmount(l)>0);$('totalLoan').textContent=money(total);$('totalGold').textContent=gold.toFixed(3)+' Tola';$('dueCount').textContent=dues.length;$('homeDue').innerHTML=dues.length?dues.slice(0,3).map(l=>loanCard(l)).join(''):'<div class="card empty">No interest due.</div>';$('recentLoans').innerHTML=loans.length?loans.slice(0,3).map(l=>loanCard(l,false)).join(''):'<div class="card empty">No loans added yet.</div>'}function renderLoans(){$('loanList').innerHTML=loans.length?loans.map(l=>loanCard(l,false)).join(''):'<div class="card empty">No loan records.</div>'}function renderDue(){let d=loans.filter(l=>dueAmount(l)>0);$('dueList').innerHTML=d.length?d.map(loanCard).join(''):'<div class="card empty">All interest is paid.</div>'}function customers(){let m={};loans.forEach(l=>{let k=l.mobile||l.name;if(!m[k])m[k]={name:l.name,mobile:l.mobile,loans:[],amount:0,gold:0,due:0};m[k].loans.push(l);m[k].amount+=+l.amount||0;m[k].gold+=+l.gold||0;m[k].due+=dueAmount(l)});return Object.values(m)}function renderCustomers(){let c=customers();$('customerList').innerHTML=c.length?c.map((x,i)=>`<div class="card" onclick="openProfile('${encodeURIComponent(x.mobile||x.name)}')"><div class="row"><div><div class="name">${esc(x.name)}</div><div class="muted">${esc(x.mobile)} • ${x.loans.length} loan(s)</div></div><span class="pill ${x.due?'red':''}">${x.due?money(x.due)+' due':'Paid'}</span></div><div class="row" style="margin-top:10px"><b>${money(x.amount)}</b><b>${x.gold.toFixed(3)} Tola</b></div></div>`).join(''):'<div class="card empty">No customers.</div>'}function openProfile(k){k=decodeURIComponent(k);let c=customers().find(x=>(x.mobile||x.name)===k);if(!c)return;$('profileBody').innerHTML=`<div class="card"><div class="profileTop"><div class="avatar">${esc(c.name.charAt(0).toUpperCase())}</div><div><div class="name">${esc(c.name)}</div><div class="muted">${esc(c.mobile)}</div></div></div><div class="stats" style="margin-top:14px"><div class="stat"><small>Total Loan</small><b>${money(c.amount)}</b></div><div class="stat gold"><small>Total Gold</small><b>${c.gold.toFixed(3)} Tola</b></div><div class="stat wide due"><small>Total Interest Due</small><b>${money(c.due)}</b></div></div><div class="actions"><a class="btn" href="tel:${esc(c.mobile)}">Call Customer</a></div></div><div class="section"><h2>Loan & Gold Records</h2>${c.loans.map(l=>`<div class="card">${l.photo?`<img class="photo" src="${l.photo}">`:''}<div style="margin-top:8px"><b>${money(l.amount)}</b> • ${Number(l.gold||0).toFixed(3)} Tola</div><div class="muted">${esc(l.date)} • ${Number(l.interest||0)}% monthly</div><div style="margin-top:7px">${esc(l.details||'No details')}</div><div class="muted" style="margin-top:7px">Paid months: ${l.paidMonths||0} • Due: ${money(dueAmount(l))}</div></div>`).join('')}</div>`;go('profile')}function render(){renderHome();renderLoans();renderDue();renderCustomers()}$('fDate').value=new Date().toISOString().slice(0,10);render();
</script></body></html>
