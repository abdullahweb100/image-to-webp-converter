name: Bhawani Emulator Install Test

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'bhawani-app/**'
      - '.github/workflows/bhawani-emulator-test.yml'

jobs:
  test-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: bhawani-app
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose bhawani-app/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging bhawani-app/app/build/outputs/apk/debug/app-debug.apk | head -20

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r bhawani-app/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm list packages | grep com.bhawani.agent.clientapp
            adb shell am start -n com.bhawani.agent.clientapp/com.bhawani.commissionagent.MainActivity
            sleep 5
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep com.bhawani.agent.clientapp

      - name: Prepare APK
        run: cp bhawani-app/app/build/outputs/apk/debug/app-debug.apk Bhawani-Commission-Agent.apk

      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: Bhawani-Commission-Agent-Tested
          path: Bhawani-Commission-Agent.apk
          if-no-files-found: error
