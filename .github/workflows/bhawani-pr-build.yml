name: Bhawani Android PR Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'bhawani-app/**'
      - '.github/workflows/bhawani-pr-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: bhawani-app
        run: gradle --no-daemon assembleDebug

      - name: Verify and name APK
        run: |
          cp bhawani-app/app/build/outputs/apk/debug/app-debug.apk Bhawani-Commission-Agent.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging Bhawani-Commission-Agent.apk | head -20
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose Bhawani-Commission-Agent.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bhawani-Commission-Agent
          path: Bhawani-Commission-Agent.apk
          if-no-files-found: error
